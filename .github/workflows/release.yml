name: release

# Push to main (or a v* tag) -> if no release exists yet for the app version, build an UNSIGNED .ipa
# and publish a GitHub Release "v<MARKETING_VERSION>" with it attached. No manual tagging needed:
# bump MARKETING_VERSION in project.yml and push to ship a new version.
# Unsigned on purpose: iLoader / Sideloadly / AltStore re-sign with the user's Apple ID at install.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap Linux check first, so the (often queued) macOS runner is only used when there is a new version.
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(grep -m1 'MARKETING_VERSION:' project.yml | grep -oE '[0-9]+(\.[0-9]+)+')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen xcbeautify && xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build -project "Angra iOS Streaming.xcodeproj" -scheme LivePipe \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcbeautify --renderer github-actions

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r "Angra-iOS-Streaming.ipa" Payload

      - name: Publish release with IPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Angra-iOS-Streaming.ipa
          generate_release_notes: true
