name: ci

# Build check on every push/PR: generate the project and compile for the simulator (unsigned).
on:
  push:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]   # docs-only pushes don't need a macOS runner
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen xcbeautify
      - run: xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild build -project "Angra iOS Streaming.xcodeproj" -scheme LivePipe \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
