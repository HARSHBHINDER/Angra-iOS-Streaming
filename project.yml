name: Angra iOS Streaming
options:
  createIntermediateGroups: true
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.2.5            # 2.2.x needs Xcode 26 / Swift 6 toolchain
targets:
  LivePipe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [LivePipe]
    scheme: {}                     # shared scheme so `xcodebuild -scheme LivePipe` resolves on CI
    info:
      path: LivePipe/Info.plist
      properties:
        CFBundleDisplayName: Angra iOS Streaming
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
    entitlements:
      path: LivePipe/LivePipe.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.livepipe]
    dependencies:
      - target: BroadcastExt
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livepipe.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO      # unsigned CI build; real devices need signing + the app group
  BroadcastExt:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [BroadcastExt, LivePipe/Store.swift]  # share the Destination/Store model with the extension
    info:
      path: BroadcastExt/Info.plist
      properties:
        CFBundleDisplayName: Angra iOS Streaming
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExt/BroadcastExt.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.livepipe]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livepipe.app.broadcast
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
